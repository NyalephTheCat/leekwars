[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # Cranelift / Wasmtime crates (the native backend) are Apache-2.0 with the
    # LLVM exception.
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "ISC",
    "Zlib", # foldhash (pulled in transitively via hashbrown)
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
