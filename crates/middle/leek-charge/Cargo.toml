[package]
name        = "leek-charge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional HIR pass that inserts static op-budget Charge instructions."

[dependencies]
leek-hir      = { workspace = true }
leek-span     = { workspace = true }
leek-pipeline = { workspace = true }
salsa         = { version = "0.26", optional = true }

[features]
default = []
# Adds a `charge_query` salsa-tracked entry point. Calls
# `lower_hir_query` and re-runs only when the lowered HIR changes.
salsa = [
  "dep:salsa",
  "leek-pipeline/salsa",
  "leek-hir/salsa",
  "leek-span/salsa",
]

[dev-dependencies]
# Self dev-dependency: nothing in the workspace requests
# `leek-charge/salsa`, so without this `charge_query` is never compiled by
# `cargo test --workspace` or linted by `clippy --all-targets`. Same fix,
# same reason, as crates/middle/leek-mir/Cargo.toml.
leek-charge = { path = ".", features = ["salsa"] }
# The memoization test drives a real pipeline, so it needs the
# salsa-enabled frontend stages and the input setter.
leek-syntax = { workspace = true, features = ["salsa"] }
leek-lexer  = { workspace = true, features = ["salsa"] }
leek-parser = { workspace = true, features = ["salsa"] }

[lints]
workspace = true
