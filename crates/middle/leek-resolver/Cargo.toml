[package]
name        = "leek-resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Name resolution and scope analysis for Leekscript."

[dependencies]
leek-config      = { workspace = true }
leek-span        = { workspace = true }
leek-syntax      = { workspace = true }
leek-lexer       = { workspace = true }
leek-parser      = { workspace = true }
leek-diagnostics = { workspace = true }
leek-builtins    = { workspace = true }
leek-query       = { workspace = true }
rowan            = { workspace = true }
salsa            = { workspace = true }

[dev-dependencies]
leek-hir         = { workspace = true }
# The end-to-end include tests drive `pipeline_with_includes` up to
# `Target::TypeChecked`, so they assert on the type checker's artifact.
leek-types       = { workspace = true }
leek-diagnostics = { workspace = true }
leek-project     = { workspace = true }
leek-db          = { workspace = true, features = ["testing"] }

[lints]
workspace = true
