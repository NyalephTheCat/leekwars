[package]
name        = "leek-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Miku.toml manifest schema, parser, and project discovery for Leekscript."

[dependencies]
leek-diagnostics = { workspace = true }
leek-span        = { workspace = true }
# The span-preserving half of the `toml` crate the workspace already uses
# (`toml` 0.8 depends on it), so this is a direct dep on a tree node that is
# already there, not a new dependency.
toml_edit        = { workspace = true }

[lints]
workspace = true
