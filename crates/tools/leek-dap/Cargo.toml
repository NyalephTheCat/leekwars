[package]
name        = "leek-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Debug Adapter Protocol implementation for Leekscript (native backend)."

[dependencies]
# Compile + run the debuggee. The native (Cranelift) backend is the debug
# target: `NativeOptions::debug()` keeps frame pointers and emits DWARF.
leek-backend-native = { workspace = true }
leek-hir         = { workspace = true }
# Breakpoint verification: lower the program's HIR a second time to learn
# which source lines the backend emits a debug safepoint on.
leek-mir         = { workspace = true }
leek-span        = { workspace = true }
leek-project     = { workspace = true }
leek-diagnostics = { workspace = true }
# Compile the way the rest of the toolchain does: the project manifest
# settles the language defaults and `leek-session`'s include step resolves
# `include()` off disk with the same `SourceId` numbering as `miku run`.
leek-session     = { workspace = true }
leek-manifest    = { workspace = true }
leek-resolver    = { workspace = true }
# Debugging an AI inside a fight: build the fight from a scenario and drive it.
leek-scenario    = { workspace = true }
leek-generator   = { workspace = true }
# Breakpoint conditions, logpoint messages and `evaluate`: parse the client's
# expression with the real parser at the debugged program's language version,
# then evaluate it on the runtime's own operator semantics rather than a
# second, drifting implementation of them.
leek-parser      = { workspace = true }
leek-syntax      = { workspace = true }
leek-runtime     = { workspace = true }
leek-text        = { workspace = true }

dap         = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }

[lints]
workspace = true
