[package]
name        = "leek-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Leekscript linter — rule engine over HIR."

[dependencies]
leek-span        = { workspace = true }
leek-diagnostics = { workspace = true }
leek-hir         = { workspace = true }
leek-query       = { workspace = true }
leek-resolver    = { workspace = true }
leek-syntax      = { workspace = true }
leek-parser      = { workspace = true }
# `diagnostics_with_lints` appends this crate's findings to
# `leek_db::diagnostics_without_lints`, and the concatenation has to live
# here: `leek-db` is `crates/db` (rank 3), this is `crates/tools`
# (rank 6), and db -> tools is the edge `cargo xtask check-layers` exists
# to reject. tools -> db is downward and needs no allowlist entry.
leek-db          = { workspace = true }
salsa            = { workspace = true }

[dev-dependencies]
leek-project     = { workspace = true }
leek-rewrite     = { workspace = true }

[lints]
workspace = true
