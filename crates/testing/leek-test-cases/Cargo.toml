[package]
name        = "leek-test-cases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Data model for extracted upstream JUnit test cases."

# Deliberately tiny (#150): this crate is `leek-test-corpus`'s *build*
# dependency, and a build-dependency is codegen'd and linked, not merely
# checked. Depending on `leek-test-driver` here dragged the whole
# compiler — Cranelift included — into every `cargo check`/`clippy` of
# the workspace to run one build script. Keep it to serde + toml.
[dependencies]
serde  = { workspace = true }
toml   = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
