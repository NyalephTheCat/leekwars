[package]
name        = "leek-test-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared fixtures and parity-test infrastructure."
build       = "build.rs"

# Keep this list tiny (#150). `src/extract.rs` is compiled twice — here
# as a module of `build.rs`, and as `pub mod extract` of the library — so
# whatever it imports has to be both a build- and a normal dependency.
# `leek-test-cases` exists so that crate is serde + toml rather than the
# whole compiler; a build-dependency is codegen'd, not merely checked.
[build-dependencies]
leek-test-cases = { workspace = true }
anyhow          = { workspace = true }

[dependencies]
leek-test-cases     = { workspace = true }
leek-test-driver    = { workspace = true }
leek-backends       = { workspace = true }
leek-manifest       = { workspace = true }
leek-diagnostics    = { workspace = true }
leek-lexer          = { workspace = true }
leek-parser         = { workspace = true }
leek-project        = { workspace = true }
leek-session        = { workspace = true }
leek-span           = { workspace = true }
leek-syntax         = { workspace = true }
toml                = { workspace = true }
anyhow              = { workspace = true }

# Dev-only, and deliberately so: the corpus is where the formatter meets
# real programs (`tests/fmt_roundtrip.rs`), but nothing here builds on it.
[dev-dependencies]
leek-fmt = { workspace = true }
# `tests/native_compat_agreement.rs` only: the compat check is worth having
# only if it agrees with a real compile, and the corpus is where the two meet
# thousands of real programs. Dev-only — nothing this crate ships links the
# backend, which it already reaches transitively through `leek-test-driver`.
leek-backend-native = { workspace = true }
leek-hir            = { workspace = true }

# Single binary (`src/main.rs`, auto-detected by Cargo); subcommands
# replace the former one-binary-per-task layout. See `src/main.rs`.

[lints]
workspace = true
