[package]
name        = "leek-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Per-backend benchmark harness for Leekscript: interpreter, native (Cranelift JIT), emitted Java, upstream Java reference."

[dependencies]
leek-span         = { workspace = true }
leek-diagnostics  = { workspace = true }
leek-syntax       = { workspace = true }
leek-hir          = { workspace = true }
leek-backend-java = { workspace = true }
leek-backend-native = { workspace = true }
leek-pipeline     = { workspace = true }
# The query façade, plus the two crates whose process-global compilation
# settings a query reads at its entry boundary — the same pair
# `leek-session` threads in when it builds an input.
leek-db           = { workspace = true }
leek-prelude      = { workspace = true }
leek-project      = { workspace = true }
leek-session      = { workspace = true }
leek-types        = { workspace = true }
anyhow            = { workspace = true }

[lints]
workspace = true
