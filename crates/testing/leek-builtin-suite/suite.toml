source = "return [getDate(), getTime()]"
expect = { equals = "[0, 0]" }

[[tests]]
id = "get_time_is_zero_outside_a_fight"
builtin = "getTime"
version = 4
source = "return getTime()"
expect = { equals = "0" }

[[tests]]
id = "interval_is_left_closed_reads_the_opening_bracket"
builtin = "intervalIsLeftClosed"
version = 4
source = "var open = ]1..5[; return [intervalIsLeftClosed([1..5]), intervalIsLeftClosed(open)]"
expect = { equals = "[true, false]" }

[[tests]]
id = "interval_is_right_closed_reads_the_closing_bracket"
builtin = "intervalIsRightClosed"
version = 4
source = "var open = ]1..5[; return [intervalIsRightClosed([1..5]), intervalIsRightClosed(open)]"
expect = { equals = "[true, false]" }

# --- String indexing, end to end: one index space, in UTF-16 code units
# --- (#268, #356). The same table `leek-runtime`'s `string_index_seam` test
# --- asserts in-process, run here through the native backend so the answer a
# --- compiled program sees is pinned too. `charCodeAt` and `ord` are local
# --- extensions with no catalog entry, so their rows carry no `builtin`.
#
# ASCII: bytes, scalars and code units are the same number, so this row would
# pass under any of the three conventions — it is the control.
[[tests]]
id = "char_at_ascii_agrees_with_char_code_at"
builtin = "charAt"
version = 4
source = "return [charAt('bonjour', 1), charCodeAt('bonjour', 1), codePointAt('bonjour', 1)]"
expect = { equals = '["o", 111, 111]' }

# BMP: `é` is two bytes and one code unit. `length` counts 5, and every
# position-taking builtin has to count the same way.
[[tests]]
id = "bmp_string_indexes_in_code_units"
builtin = "charAt"
version = 4
source = "return [length('héllo'), charAt('héllo', 1), charCodeAt('héllo', 1), codePointAt('héllo', 1)]"
expect = { equals = '[5, "é", 233, 233]' }

# Astral: the emoji is one scalar and *two* code units, so `b` sits at
# position 3 — where `length` says the string ends — and not at 2.
[[tests]]
id = "astral_char_at_reads_the_position_length_promises"
builtin = "charAt"
version = 4
source = "return [length('a😀b'), charAt('a😀b', 3)]"
expect = { equals = '[4, "b"]' }

# Each half of the surrogate pair is addressable. `charCodeAt` answers the
# surrogate; `codePointAt` recombines the pair at its high half and answers
# the lone low half on its own — the upstream corpus pins the same shape with
# `codePointAt('🐨🐨', 2)` → 128040.
[[tests]]
id = "astral_code_units_are_addressable_one_by_one"
builtin = "codePointAt"
version = 4
source = "return [charCodeAt('a😀b', 1), charCodeAt('a😀b', 2), codePointAt('a😀b', 1), codePointAt('a😀b', 2)]"
expect = { equals = "[55357, 56832, 128512, 56832]" }

# `codePointAt(s)` — the one-argument form, which had no implementation at all
# and answered null. Upstream: 0 for an empty string, else the code point at 0.
[[tests]]
id = "code_point_at_one_arg_reads_position_zero"
builtin = "codePointAt"
version = 4
source = "return [codePointAt('A'), codePointAt('😀'), codePointAt('')]"
expect = { equals = "[65, 128512, 0]" }

# `substring` cuts at the positions the other builtins report, so the window
# [1, 3) is exactly the emoji.
[[tests]]
id = "substring_cuts_at_utf16_positions"
builtin = "substring"
version = 4
source = "return [substring('a😀b', 1, 2), substring('a😀b', 3), substring('héllo', 1, 2)]"
expect = { equals = '["😀", "b", "él"]' }

# `indexOf` reports a *position*, not a byte offset: `là` starts at unit 6 of
# `héllo là`, whose two accented characters are two bytes each.
[[tests]]
id = "index_of_answers_in_utf16_positions"
builtin = "indexOf"
version = 4
source = "return [indexOf('héllo là', 'là'), indexOf('héllo là', 'là', 2), indexOf('a😀b', 'b')]"
expect = { equals = "[6, 6, 3]" }

# `ord` is `charCodeAt(s, 0)`: on an astral character that is the high
# surrogate, not the whole scalar.
[[tests]]
id = "ord_is_char_code_at_zero"
version = 4
source = "return [ord('A'), ord('é'), ord('😀'), charCodeAt('😀', 0)]"
expect = { equals = "[65, 233, 55357, 55357]" }

# The bracket and the slice are the same index space as the builtins.
[[tests]]
id = "string_index_and_slice_share_the_builtins_positions"
version = 4
source = "var s = 'a😀b' return [s[3], s[1:3], s[0:1]]"
expect = { equals = '["b", "😀", "a"]' }

# --- Out of range. Each builtin reproduces its own upstream method, and the
# --- answers deliberately differ — `StringClass.charAt` returns null,
# --- `StringClass.codePointAt` returns 0.
[[tests]]
id = "char_at_out_of_range_is_null"
builtin = "charAt"
version = 4
source = "return [charAt('abc', 3), charAt('abc', -1), charAt('', 0)]"
expect = { equals = "[null, null, null]" }

[[tests]]
id = "char_code_at_out_of_range_is_null"
version = 4
source = "return [charCodeAt('abc', 3), charCodeAt('abc', -1), ord('')]"
expect = { equals = "[null, null, null]" }

[[tests]]
id = "code_point_at_out_of_range_is_zero"
builtin = "codePointAt"
version = 4
source = "return [codePointAt('abc', 3), codePointAt('abc', -1), codePointAt('', 0)]"
expect = { equals = "[0, 0, 0]" }

# `StringClass.substring` rejects four ways: an index at or past the end, a
# negative index, a window that runs off the end, and a negative length. All
# four are null, never a short or empty string.
[[tests]]
id = "substring_out_of_range_is_null"
builtin = "substring"
version = 4
source = "return [substring('abc', 3), substring('abc', -1), substring('abc', 1, 5), substring('abc', 0, -1)]"
expect = { equals = "[null, null, null, null]" }

[[tests]]
id = "substring_in_range_up_to_the_last_unit"
builtin = "substring"
version = 4
source = "return [substring('abc', 0, 3), substring('abc', 2), substring('abc', 2, 0)]"
expect = { equals = '["abc", "c", ""]' }

# Not found: the two arities have always answered differently — the plain form
# null, the `from` form -1 — and a `from` past the end finds nothing.
[[tests]]
id = "index_of_not_found_keeps_its_two_answers"
builtin = "indexOf"
version = 4
source = "return [indexOf('héllo', 'z'), indexOf('héllo', 'z', 0), indexOf('héllo', 'l', 9)]"
expect = { equals = "[null, -1, -1]" }

# --- 2.50 bit builtins (`NumberClass.bitLength` / `setBit` / `testBit`). ---

# `64 - Long.numberOfLeadingZeros(x)`: 0 for 0, and 64 for any negative
# number (its sign bit is set) — NOT BigInteger's sign-excluding reading.
[[tests]]
id = "bit_length_counts_significant_bits"
builtin = "bitLength"
version = 4
source = "return [bitLength(0), bitLength(1), bitLength(255), bitLength(256), bitLength(-1)]"
expect = { equals = "[0, 1, 8, 9, 64]" }

# `1L << pos`, so bit 63 is reachable and lands on the sign bit.
[[tests]]
id = "set_bit_sets_and_clears"
builtin = "setBit"
version = 4
source = "return [setBit(0, 3), setBit(255, 0, false), setBit(0, 63), setBit(8, 3, true)]"
expect = { equals = "[8, 254, -9223372036854775808, 8]" }

# The three-arg form is overloaded on `boolean` and on "non-zero sets".
[[tests]]
id = "set_bit_takes_a_number_as_its_flag"
builtin = "setBit"
version = 4
source = "return [setBit(0, 5, 1), setBit(1, 0, 0), setBit(0, 5, 7)]"
expect = { equals = "[32, 0, 32]" }

# Java's long shift masks the distance to its low six bits, so `pos` 64
# addresses bit 0 again and a negative `pos` wraps the same way.
[[tests]]
id = "set_bit_shift_distance_wraps_at_64"
builtin = "setBit"
version = 4
source = "return [setBit(0, 64), setBit(0, 65), testBit(1, 64)]"
expect = { equals = "[1, 2, true]" }

[[tests]]
id = "test_bit_reads_one_bit"
builtin = "testBit"
version = 4
source = "return [testBit(5, 0), testBit(5, 1), testBit(5, 2), testBit(-1, 63)]"
expect = { equals = "[true, false, true, true]" }

# The same three functions on `big_integer`, where the answers diverge from
# the fixed-width `long` ones the moment a value needs more than 64 bits.
# `bitLength` becomes Java's minimal two's-complement length, and `setBit`
# hands back a `big_integer` even when the result would fit in a long.
[[tests]]
id = "bit_length_of_a_big_integer_is_unbounded"
builtin = "bitLength"
version = 4
source = "return [bitLength(255L), bitLength(5L), bitLength(1L << 100)]"
expect = { equals = "[8, 3, 101]" }

[[tests]]
id = "set_bit_on_a_big_integer_stays_a_big_integer"
builtin = "setBit"
version = 4
source = "return [setBit(0L, 100) == 1L << 100, setBit(0L, 100) instanceof BigInteger, setBit(5L, 0, false), setBit(0L, 1, true)]"
expect = { equals = "[true, true, 4, 2]" }

[[tests]]
id = "test_bit_reads_past_the_64th_bit_of_a_big_integer"
builtin = "testBit"
version = 4
source = "return [testBit(5L, 0), testBit(5L, 1), testBit(1L << 100, 100), testBit(1L << 100, 99)]"
expect = { equals = "[true, false, true, false]" }

# `bitCount` and `trailingZeros` gained the same `big_integer` overload.
# `trailingZeros` is `getLowestSetBit` there, so zero answers -1 rather than
# the long form's 64.
[[tests]]
id = "bit_count_and_trailing_zeros_of_a_big_integer"
builtin = "bitCount"
version = 4
source = "return [bitCount(255L), bitCount((1L << 100) - 1L), trailingZeros(8L), trailingZeros(1L << 100), trailingZeros(0L)]"
expect = { equals = "[8, 100, 3, 100, -1]" }

# --- Redefining a system function (v1–v3 only). ---

# Once a plain assignment has redefined a builtin name, it is an ordinary
# variable: mutating it is ordinary too. Upstream fixed this in 2026 after a
# real AI failed to compile on `count = 0; count += 1` inside a function.
[[tests]]
id = "a_redefined_builtin_can_then_be_mutated"
version = 3
source = "function f() { count = 0; count += 1; count++; return count; } return f()"
expect = { equals = "2" }

# Mutating one that is still the function reads a function value first, and
# stays an error at every version.
[[tests]]
id = "mutating_a_builtin_that_is_still_a_function_is_refused"
version = 3
source = "abs += 1; return 0"
expect = "error"

# v4 dropped first-class redefinition altogether: even the plain form is out.
[[tests]]
id = "redefining_a_builtin_is_refused_at_v4"
version = 4
source = "abs = 2 return abs"
expect = "error"
