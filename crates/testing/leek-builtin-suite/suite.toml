source = "return getTime()"
expect = { equals = "0" }

[[tests]]
id = "interval_is_left_closed_reads_the_opening_bracket"
builtin = "intervalIsLeftClosed"
version = 4
source = "var open = ]1..5[; return [intervalIsLeftClosed([1..5]), intervalIsLeftClosed(open)]"
expect = { equals = "[true, false]" }

[[tests]]
id = "interval_is_right_closed_reads_the_closing_bracket"
