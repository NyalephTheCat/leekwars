[package]
name        = "leek-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The query façade: one salsa database and every tracked query under a single import path."

[dependencies]
# Owns the database itself — `Db`, `LeekDb`, `SourceFile`, `WorkspaceFiles`.
# This crate sits *above* `leek-pipeline`, never below: the pass crates write
# their queries against `leek_pipeline::salsa::Db`, so the opposite edge would
# be a cycle.
leek-pipeline    = { workspace = true }
# The include-graph queries this crate owns are written against salsa
# directly.
salsa            = { workspace = true }
leek-span        = { workspace = true }
leek-diagnostics = { workspace = true }
# Every pass crate that ships a tracked query, re-exported from here. No
# tools-layer crate appears here: `leek-fmt`'s `format_query` stays in
# `leek-fmt`, which depends *down* on this crate, because db -> tools is a
# layering breach.
# The compilation configuration `lower_program` samples at its entry
# boundary (which libraries and constant catalogs are active). A core
# crate, so the db -> core edge is downward.
leek-prelude     = { workspace = true }
leek-syntax      = { workspace = true }
leek-lexer       = { workspace = true }
leek-parser      = { workspace = true }
leek-resolver    = { workspace = true }
leek-types       = { workspace = true }
leek-hir         = { workspace = true }
leek-mir         = { workspace = true }
leek-complexity  = { workspace = true }

[features]
default = []
# Exposes `leek_db::testing` — the event-logging database every
# incremental assertion in epic #345 is written against. A feature rather
# than `#[cfg(test)]` alone because the consumers live in *other* crates'
# tests (the LSP's, this crate's own integration tests), and a
# `#[cfg(test)]` item is invisible to both.
testing = []

[dev-dependencies]
# This crate's integration tests need `leek_db::testing`, and a test target
# links the library as an ordinary dependency — so the feature has to be
# turned on the same way any other dev-only feature is.
leek-db = { path = ".", features = ["testing"] }

[lints]
workspace = true
