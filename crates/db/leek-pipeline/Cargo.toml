[package]
name        = "leek-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compiler pipeline orchestration for Leekscript."

[dependencies]
leek-span        = { workspace = true }
leek-diagnostics = { workspace = true }
leek-project     = { workspace = true }
salsa            = { version = "0.26", optional = true }

[dev-dependencies]
leek-hir      = { workspace = true }
leek-mir      = { workspace = true }
leek-session  = { workspace = true }

[features]
default = []
# Provide a salsa-backed memoization layer. When enabled the pipeline
# exposes a `salsa` module with a `Db` trait and `LeekDb` concrete
# database, plus a `SourceFile` input. Steps can dispatch to tracked
# queries when [`Context::salsa`] returns `Some(db, file)` — useful for
# cross-run caching (the LSP re-checking an edited buffer). Off by
# default so a crate that only ever runs a pipeline once can depend on
# this one without salsa; note that every front-end shipped here plans
# through `leek-session`, which turns the feature on unconditionally.
salsa = ["dep:salsa"]

[lints]
workspace = true
