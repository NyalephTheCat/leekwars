name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting + the toolchain-pin check + the architecture (layer) check +
  # generated-catalog drift. Cheap and fast, so it runs on its own and fails
  # early.
  fmt:
    name: rustfmt + toolchain + layer + artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The official* submodules back the generated weapon/chip catalog
          # drift check; fetch them so it actually runs.
          submodules: recursive
      - name: Install Rust (exact version pinned by rust-toolchain.toml)
        run: rustup show
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      # The pin only protects CI if it stays exact and keeps matching the
      # advertised MSRV; this fails the build the moment it doesn't.
      - name: toolchain pin check
        run: cargo xtask check-toolchain
      - name: layer check
        run: cargo xtask check-layers
      # Library crates return typed errors; `anyhow` is for the front-ends.
      - name: error-convention check
        run: cargo xtask check-errors
      # One spelling for formatting into a `String`: `let _ = write!(…)`.
      - name: formatting-idiom check
        run: cargo xtask check-fmt-idiom
      # Generated output (the upstream compiler's `ai/` tree) must stay out of
      # git; a stray `git add -A` once committed 387 files of it.
      - name: generated-artifact check
        run: cargo xtask check-artifacts
      - name: generated catalog drift
        run: tools/game-item-extract.sh --check
      # The fight-constant table and the engine's generated consts_gen.rs,
      # which is what keeps `getCellContent` and the AI's CELL_* agreeing.
      - name: fight constant drift
        run: tools/game-builtin-extract.sh --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (exact version pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS leg runs on Apple Silicon, where the Cranelift JIT hits an
    # upstream AArch64 branch-relocation assertion (cranelift-jit's
    # compiled_blob 26-bit range check). Keep it for visibility but don't let
    # it block: the canonical gate (tools/check.sh) is Linux-only.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust (exact version pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # A JDK is only needed for the (snapshot-gated) Java-backend parity
      # tests; without it those tests skip cleanly. Installing it gives the
      # broadest coverage. The JVM cross-check itself still skips here — it
      # also needs tools/java-emitter/build.sh to have produced the upstream
      # emitter jar, which this job does not build. Runners that do have it
      # should set LEEK_REQUIRE_JVM=1 so the parity ratchets cannot pass by
      # skipping; `tools/check.sh` exports it automatically.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: cargo build --workspace
        run: cargo build --workspace --locked
      # A build script may write into OUT_DIR and nowhere else. This job has
      # both a JDK and the submodules, which is exactly the combination that
      # used to let leek-test-corpus's build script rewrite the tracked 13 MB
      # data/reference.tsv from a multi-minute JVM run (#148).
      - name: build left the tracked corpus data alone
        run: git diff --exit-code -- crates/testing/leek-test-corpus/data
      # Mirrors `tools/check.sh`: the fast gate excludes the multi-minute
      # upstream corpus suite. That one runs in the separate `corpus` workflow
      # (.github/workflows/corpus.yml) — nightly, and on PRs touching the
      # compiler.
      - name: cargo test --workspace (fast)
        run: cargo test --workspace --exclude leek-test-corpus --locked
      # The debug adapter's fight test plays a whole duel and registers the
      # leek-wars library process-wide, so it is `#[ignore]`d and runs here in
      # a process of its own. It replaced tools/dap-fight-smoke.py, which
      # nothing ever ran.
      - name: cargo test -p leek-dap (ignored)
        run: cargo test -p leek-dap --locked -- --ignored
      # The Java-backend parity tests compare against tests/snapshots/ and
      # write everything they produce under target/ (see tools/check.sh); a
      # test run must leave every tracked snapshot byte-identical to what was
      # committed.
      - name: test run left the tracked snapshots alone
        run: git diff --exit-code -- crates/backends/leek-backend-java/tests/snapshots

  # Coverage REPORT, never a gate (#151). The point is visibility: this repo
  # accumulated eight crates with literally zero `#[test]` before anyone
  # noticed, and the only reason it was noticed was a hand-run grep. A number
  # per crate in the job log makes that kind of rot visible on the PR that
  # causes it.
  #
  # Deliberately not a threshold and deliberately not in any required-check
  # set: several crates legitimately report ~0 (`leek-aot-runtime` is a
  # `staticlib` exercised from another crate's test binary, `bins/leek-dap` is
  # a five-line stdio shim), so a gate would fail forever or force
  # exclusions that hide the real signal.
  coverage:
    name: coverage report (not a gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust (exact version pinned by rust-toolchain.toml)
        run: rustup show
      # cargo-llvm-cov needs the profdata/profraw tooling, which the pin does
      # not request for everyone else's `rustup show`.
      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Mirrors the fast test gate's exclusion: the upstream corpus suite is
      # a multi-minute JVM run that lives in .github/workflows/corpus.yml.
      - name: cargo llvm-cov
        run: |
          cargo llvm-cov --workspace --exclude leek-test-corpus --locked \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: warn

  # Supply-chain / license audit driven by deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # VS Code extension (TypeScript) — type-check and bundle so the editor
  # integration doesn't rot independently of the Rust workspace.
  vscode-extension:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: install + typecheck + test + compile
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run compile
