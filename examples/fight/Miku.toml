# Makes this example folder a miku project, so `miku --library leekwars check`
# / `miku fmt` work on the AIs in `ais/`, and so a bare `miku fight` runs the
# duel (see `[fight]`). An explicit scenario argument always wins.
[project]
name     = "fight-example"
version  = "0.1.0"
language = 4
entry    = "ais/hero.leek"

[paths]
src = "ais"

[backend.native]
enable  = true
default = true

[fight]
default_scenario = "duel.toml"
scenarios_dir    = "."
